<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR 猫娘相机与互动</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .container {
      position: relative;
      width: 640px;
      height: 480px;
      border: 3px solid #ff69b4;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.4);
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* 镜像画面，符合镜头习惯 */
    }
    .overlay-ui {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 20px;
      border-radius: 20px;
      display: flex;
      gap: 15px;
    }
    button {
      background: #ff69b4;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 15px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    button:hover {
      background: #ff1493;
    }
    .status-text {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
      color: #00ffcc;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="status-text" id="status">正在初始化摄像头...</div>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>
    
    <div class="overlay-ui">
      <button onclick="toggleCamera()">开启/关闭摄像头</button>
      <button onclick="playInteraction()">猜拳互动</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const statusText = document.getElementById('status');
    let stream = null;

    async function initCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        statusText.innerText = "摄像头连线成功 | AR猫娘就绪";
      } catch (err) {
        statusText.innerText = "无法获取摄像头，请检查权限！";
        console.error("Camera error: ", err);
      }
    }

    function toggleCamera() {
      if (stream) {
        let tracks = stream.getTracks();
        tracks.forEach(track => track.stop());
        stream = null;
        statusText.innerText = "摄像头已关闭";
      } else {
        initCamera();
      }
    }

    function playInteraction() {
      alert("喵~ 请向镜头伸出手掌开始猜拳吧！");
    }

    // 页面加载自动开启摄像头
    window.onload = initCamera;
  </script>
</body>
</html>
