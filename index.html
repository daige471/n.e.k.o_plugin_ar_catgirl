<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR 猫娘相机与手势识别</title>
  <!-- 引入 MediaPipe 手势识别库 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .container {
      position: relative;
      width: 640px;
      height: 480px;
      border: 3px solid #ff69b4;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.4);
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }
    .status-text {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 15px;
      color: #00ffcc;
      font-weight: bold;
    }
    .gesture-result {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(255, 105, 180, 0.85);
      color: white;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="status-text" id="status">正在加载 AI 手势模型...</div>
    <video id="webcam" autoplay playsinline style="display:none;"></video>
    <canvas id="output_canvas"></canvas>
    <div class="gesture-result" id="gesture">请向镜头伸出手掌 / 出拳</div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status');
    const gestureText = document.getElementById('gesture');

    function onResults(results) {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        statusText.innerText = "🟢 已检测到手势 | AR 猫娘互动中";
        
        // 简单手势检测逻辑 (食指与中指位置)
        const landmarks = results.multiHandLandmarks[0];
        const indexTip = landmarks[8].y;
        const indexMcp = landmarks[5].y;
        const middleTip = landmarks[12].y;
        const middleMcp = landmarks[9].y;

        if (indexTip < indexMcp && middleTip < middleMcp) {
          gestureText.innerText = "✌️ 识别到手势：剪刀！猫娘出石头，你输啦~";
        } else if (indexTip < indexMcp) {
          gestureText.innerText = "☝️ 识别到手势：指点/招呼！喵~";
        } else if (indexTip > indexMcp && middleTip > middleMcp) {
          gestureText.innerText = "✊ 识别到手势：石头！猫娘出布，你输啦~";
        } else {
          gestureText.innerText = "✋ 识别到手势：布！平手喵~";
        }
      } else {
        statusText.innerText = "🟡 寻找手部中...";
        gestureText.innerText = "请向镜头伸出手掌 / 出拳";
      }
      canvasCtx.restore();
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    camera.start().then(() => {
      statusText.innerText = "🟢 摄像头与 AI 识别已就绪";
    }).catch(err => {
      statusText.innerText = "🔴 摄像头开启失败";
      console.error(err);
    });
  </script>
</body>
</html>
